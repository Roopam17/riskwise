if(el=t.closest('[data-rg]')){st.rg=+el.dataset.rg;keep();return}
if(el=t.closest('[data-crg]')){st.crg=+el.dataset.crg;keep();return}
if(el=t.closest('[data-ct]')){st.ct=el.dataset.ct;keep();return}
if(el=t.closest('[data-et]')){st.et=el.dataset.et;render();return}
if(el=t.closest('[data-ws]')){st.ws=el.dataset.ws;render();return}
if(el=t.closest('[data-ck]')){var k3=el.dataset.ck,x=st.sel.indexOf(k3);if(x>-1)st.sel.splice(x,1);else st.sel.push(k3);return}
if(el=t.closest('[data-ek]')){var k4=el.dataset.ek,y=st.esel.indexOf(k4);if(y>-1)st.esel.splice(y,1);else if(st.esel.length<3)st.esel.push(k4);keep();return}
if(t.closest('#cmpsel')){if(st.sel.length>1)st.cmp=st.sel.slice(0,3);go('compare');return}
if(t.closest('#cmpex')){st.cmp=st.esel.slice(0,3);go('compare');return}
if(t.closest('#cta')){if(st.logged)$('#q').focus();else{st.logged=true;render()}return}
if(t.closest('[data-act=login]')){st.logged=!st.logged;render();return}
if(t.closest('#th')){var r=$('#rw');r.dataset.t=r.dataset.t=='dark'?'light':'dark';$('#th').innerHTML='<i class="ti ti-'+(r.dataset.t=='dark'?'sun':'moon')+'" aria-hidden="true"></i>';return}
if(!t.closest('.sw'))$('#dd').style.display='none';if(!t.closest('.sbox')){var cd=$('#cdd');if(cd)cd.style.display='none'}});
document.addEventListener('change',function(e){if(e.target.id=='es'){st.es=e.target.value;render()}});
document.addEventListener('input',function(e){if(e.target.id!='cq')return;var v=e.target.value.trim().toLowerCase(),d=$('#cdd');if(!v){d.style.display='none';return}var m=srch(v,st.cmp);d.innerHTML=m.length?m.map(function(k){return ditem(k,'data-addsym')}).join(''):'<div class="t3">No match in this sample list</div>';d.style.display='block'});
$('#q').addEventListener('input',function(){var v=this.value.trim().toLowerCase(),d=$('#dd');if(!v){d.style.display='none';return}var m=srch(v,[]);d.innerHTML=m.length?m.map(function(k){return ditem(k,'data-sym')}).join(''):'<div class="t3">No match in this sample list</div>';d.style.display='block'});
st.page=(location.hash||'').slice(1)||'home';
render()})();
</script>
</body>
</html>
